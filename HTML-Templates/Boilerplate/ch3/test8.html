<!DOCTYPE html>
<html>
<head>
<style type="text/css">
    /*Rule 1*/
    table, td, th {border-spacing: 0px;}
    /*Rule 2*/
    th {background-color:#0066cc; color:white;}
    /*Rule 3*/
    table {width:100%;}
    /*Rule 4*/
    tr.head th:first-child {
        -webkit-border-top-left-radius: 5px;
        -moz-border-radius-topleft: 5px;
        border-top-left-radius: 5px;
    }
    /*Rule 5*/
    tr.head th:last-child {
        -webkit-border-top-right-radius: 5px;
        -moz-border-radius-topright: 5px;
        border-top-right-radius: 5px;
    }
    /*Rule 6*/
    tr.even {background-color:#e0e9f0;}
    /*Rule 7*/
    td {
        border-top: 1px solid #f1f8fe;
        border-bottom: 1px solid #cbd2d8;
        border-right: 1px solid #cbd2d8;
    }
    /*Rule 8*/
    th {height:30px;}
    /*Rule 9*/
    .c1 {text-align:right;}
</style>
</head>
<body>
<table>
    <tr class="head">
        <th>Firstname</th>
        <th>Lastname</th>
        <th>Salary</th>
    </tr>
    <tr>
        <td>Peter</td>
        <td>Griffin</td>
        <td class="c1">$100</td>
    </tr>
    <tr class="even">
        <td>Lois</td>
        <td>Griffin</td>
        <td class="c1">$150</td>
    </tr>
    <tr>
        <td>Joe</td>
        <td>Swanson</td>
        <td class="c1">$300</td>
    </tr>
    <tr class="even">
        <td>Cleveland</td>
        <td>Brown</td>
        <td class="c1">$250</td>
    </tr>
<ul>
    <li><a href="Chapter_3_Homepage.html">Chapter 3 Homepage</a></li>
</ul>
</table>
</body>
</html>
