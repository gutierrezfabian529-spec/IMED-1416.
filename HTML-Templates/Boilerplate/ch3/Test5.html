<!DOCTYPE html>
<html>
<head>
<style>
    ul.c1 {list-style-type: circle;}
    ul.c2 {list-style-type: square;}
    ol.c3 {list-style-type: upper-roman;}
    ol.c4 {list-style-type: lower-alpha;}
</style>
</head>
<body>
    <h3>Examples of list-style-type property</h3>
    <p><b>Unordered Lists:</b></p>
    <ul class="c1">
        <li>Accountancy</li>
        <li>Software</li>
        <li>Human Resource</li>
    </ul>
    <ul class="c2">
        <li>Accountancy</li>
        <li>Software</li>
        <li>Human Resource</li>
    </ul>
    <p><b>Ordered Lists:</b></p>
    <ol class="c3">
        <li>Accountancy</li>
        <li>Software</li>
        <li>Human Resource</li>
    </ol>
    <ol class="c4">
        <li>Accountancy</li>
        <li>Software</li>
        <li>Human Resource</li>
    </ol>
<ul>
    <li><a href="Chapter_3_Homepage.html">Chapter 3 Homepage</a></li>
</ul>
</body>
</html>
