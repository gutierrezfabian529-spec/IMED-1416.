<!DOCTYPE html>
<html>
<head>
<style>
/* Point # 1*/
@-webkit-keyframes myAnimation {
    0% {opacity:1;}
    50% {opacity:0;}
    100% {opacity:1;}
}
/* Point # 2*/
#f1 img {position:absolute;}
/* Point # 3*/
#f1 img {
    -webkit-animation-name: myAnimation;
    -webkit-animation-timing-function: ease-in-out;
    -webkit-animation-iteration-count: infinite;
    -webkit-animation-duration: 10s;
}
/* Point # 4*/
#f1 img:nth-of-type(1) {-webkit-animation-delay: 5s;}
#f1 img:nth-of-type(2) {-webkit-animation-delay: 0s;}
</style>
</head>

</ul>
<!--Point # 5-->

        <img src="img2.avif" width=100% height=100%>
</body>
</html>
