<!DOCTYPE html>
<html>
<body>
    <button onclick="fLoop()">Click Me</button>
    <p id="p1"></p>
    <script>
        function fLoop()
        {
            var a="",i;
            for(i=1;i<10;i++)
        {
            a=a + "The number is " +i+ "<br>";
        }
        document.getElementById("p1").innerHTML=a;
        }
    </script>
</body>
</html>
