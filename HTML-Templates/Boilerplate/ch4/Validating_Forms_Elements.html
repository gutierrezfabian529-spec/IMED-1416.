<!DOCTYPE html>
<html>
<head>
<title>Javascript in HTML Form</title>
<script>
    function checkData(){
        if(document.contactform.name.value.length <1){
            alert("Please enter your name");
            document.contactform.name.focus();
            return false;
        }
        return true;
    }
</script>
</head>
<body>
    <form name="contactform" onSubmit="return checkData();">
        <fieldset>
            <legend>Contact Information</legend>
            <label>Name:<br>
            <input type="text" name="name"></label><br>
            <label>Email:<br>
            <input type="text" name="email"></label><br>
            <label>Cell No.:<br>
            <input type="text" name="mobile"></label>
        </fieldset>
        <p><input type="SUBMIT" value="Submit"></p>
    </form>
</body>
</html>
