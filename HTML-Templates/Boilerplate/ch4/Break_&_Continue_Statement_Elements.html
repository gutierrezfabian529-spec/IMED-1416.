<!DOCTYPE html>
<html>
<body>
    <button onclick="BreakContinue()">Click Me</button>
    <p id="p1"></p>
    <script>
        function BreakContinue()
        {
            var a="",i=0;
            for(i=1;i<10;i++)
        {
            if(i==5)
        {
            continue;
        }
        if(i==8)
        {
            break;
        }
        a=a + "This is loop number" +i+ "<br>";
        }
        document.getElementById("p1").innerHTML=a;
        }
    </script>
</body>
</html>
