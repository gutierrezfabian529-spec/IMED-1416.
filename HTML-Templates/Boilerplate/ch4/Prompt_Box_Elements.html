<!DOCTYPE html>
<html>
<body>
    <button onclick="pBox()">Click me to bring up a Prompt Box</button>
    <p id="p1"></p>
    <script>
        function pBox()
        {
            var msg;
            var name=prompt("What is your name?","Enter Your Name");
            if (name!=null)
            {
            msg="Hello"+ name + "! Welcome to the world of JS"; 
            document.getElementById("p1").innerHTML=msg;
            }
        }
    </script>
</body>
</html>
