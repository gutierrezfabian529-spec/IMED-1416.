<!DOCTYPE html>
<html>
<body>
    <button onclick="cbox()">Click me to display a confirm box</button>
    <p id="p1"></p>
    <script>
        function cbox(){
            var x;
            var r=confirm("Click on a button!");
            if (r==true)
        {
            x="You clicked OK!";
        }
        else
        {
            x="You clicked Cancel!";
        }
        document.getElementById("p1").innerHTML=x;
        }
    </script>
</body>
</html>
