<!DOCTYPE html>
<html>
<body>
    <p>Call a function to perform mathematical operation</p>
    <p id="p1"></p>
    <script>
        function Add(x,y)
        {
            return x+y;
        }
        document.getElementById("p1").innerHTML="Sum of 10 and 3 is:"+Add(10,3);
    </script>
</body>
</html>
